name: GLI-156 Android interaction evidence

on:
  push:
    branches: [agent/codex-dev/gli-158-android-retest]

permissions:
  contents: read
  actions: read

jobs:
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39361465069
          name: smart-tro-pilot-apk-638b32a3ab07f817cd0c0b520821c016c339d778
          path: pilot-artifact
      - name: Verify pilot provenance
        run: |
          test "$(cat pilot-artifact/commit.txt)" = 638b32a3ab07f817cd0c0b520821c016c339d778
          echo '15314949ca0b2d2e5e903abcaa22b2f31f82edf4e70011ebacac1f0f546b8793  pilot-artifact/smart-tro-pilot.apk' | sha256sum -c
          python3 -m unittest discover -s scripts/gli156 -p 'test_*.py' -v
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture interaction evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install pilot-artifact/smart-tro-pilot.apk
            python3 scripts/gli156/android_interactions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gli-156-interactions-${{ github.run_id }}
          path: android-interactions/
          if-no-files-found: warn
          retention-days: 14
