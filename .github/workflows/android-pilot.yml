name: Android pilot artifact

on:
  push:
    branches: [agent/codex-dev/01a1523d]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_UI_PILOT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build bundled APK with debug signing
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Record provenance
        run: |
          mkdir -p pilot-artifact
          cp android/app/build/outputs/apk/release/app-release.apk pilot-artifact/smart-tro-pilot.apk
          git rev-parse HEAD > pilot-artifact/commit.txt
          sha256sum pilot-artifact/smart-tro-pilot.apk > pilot-artifact/apk-sha256.txt
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > pilot-artifact/run.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smart-tro-pilot-apk-${{ github.sha }}
          path: pilot-artifact/
          if-no-files-found: error
          retention-days: 14

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smart-tro-pilot-apk-${{ github.sha }}
          path: pilot-artifact
      - name: Verify Android interaction harness
        run: python3 -m unittest discover -s scripts/gli156 -t . -p 'test_*.py' -v
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce pilot interactions on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install pilot-artifact/smart-tro-pilot.apk
            python3 scripts/gli156/android_interactions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-tro-pilot-android-evidence-${{ github.sha }}
          path: android-interactions/
          if-no-files-found: warn
          retention-days: 14
