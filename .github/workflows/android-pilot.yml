name: Android pilot artifact

on:
  push:
    branches: [agent/codex-dev/01a1523d]
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/android-pilot.yml"
      - "src/pilot/**"
      - "src/ui/**"
      - "scripts/gli156/**"
      - "index.ts"
      - "metro.config.js"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: android-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify Android interaction contract and artifact fixtures
        run: python3 -m unittest discover -s scripts/gli156 -t . -p 'test_*.py' -v

  apk:
    needs: harness-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_UI_PILOT: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build bundled APK with debug signing
        working-directory: android
        # Limit parallel workers while giving the Android dependency report enough heap on GitHub-hosted runners.
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Record provenance
        run: |
          mkdir -p pilot-artifact
          cp android/app/build/outputs/apk/release/app-release.apk pilot-artifact/smart-tro-pilot.apk
          git rev-parse HEAD > pilot-artifact/commit.txt
          sha256sum pilot-artifact/smart-tro-pilot.apk > pilot-artifact/apk-sha256.txt
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > pilot-artifact/run.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smart-tro-pilot-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: pilot-artifact/
          if-no-files-found: error
          retention-days: 14

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2]
    steps:
      # The emulator runner needs the checked-in interaction harness, not just the APK artifact.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: smart-tro-pilot-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: pilot-artifact
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce pilot interactions on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install pilot-artifact/smart-tro-pilot.apk
            python3 scripts/gli156/android_interactions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-tro-pilot-android-evidence-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ matrix.attempt }}
          path: android-interactions/
          if-no-files-found: warn
          retention-days: 14
