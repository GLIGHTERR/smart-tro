name: Android pilot artifact

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact lowercase 40-character commit SHA to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-pilot-${{ inputs.commit_sha }}
  cancel-in-progress: true

jobs:
  validate_manual_ref:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
    steps:
      - id: validate
        name: Require an immutable commit SHA
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

  harness-preflight:
    needs: validate_manual_ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_manual_ref.outputs.commit_sha }}
      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate_manual_ref.outputs.commit_sha }}"
      - name: Verify Android interaction contract and artifact fixtures
        run: python3 -m unittest discover -s scripts/gli156 -t . -p 'test_*.py' -v

  apk:
    needs: [harness-preflight, validate_manual_ref]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_UI_PILOT: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_manual_ref.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build bundled APK with debug signing
        working-directory: android
        # Limit parallel workers while giving the Android dependency report enough heap on GitHub-hosted runners.
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Record provenance
        run: |
          mkdir -p pilot-artifact
          cp android/app/build/outputs/apk/release/app-release.apk pilot-artifact/smart-tro-pilot.apk
          git rev-parse HEAD > pilot-artifact/commit.txt
          sha256sum pilot-artifact/smart-tro-pilot.apk > pilot-artifact/apk-sha256.txt
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > pilot-artifact/run.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smart-tro-pilot-apk-${{ needs.validate_manual_ref.outputs.commit_sha }}
          path: pilot-artifact/
          if-no-files-found: error
          retention-days: 14

  emulator:
    needs: [apk, validate_manual_ref]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2]
    steps:
      # The emulator runner needs the checked-in interaction harness, not just the APK artifact.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_manual_ref.outputs.commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: smart-tro-pilot-apk-${{ needs.validate_manual_ref.outputs.commit_sha }}
          path: pilot-artifact
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce pilot interactions on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install pilot-artifact/smart-tro-pilot.apk
            python3 scripts/gli156/android_interactions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-tro-pilot-android-evidence-${{ needs.validate_manual_ref.outputs.commit_sha }}-attempt-${{ matrix.attempt }}
          path: android-interactions/
          if-no-files-found: warn
          retention-days: 14
