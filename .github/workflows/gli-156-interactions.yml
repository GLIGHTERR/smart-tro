name: GLI-156 Android interaction evidence

on:
  push:
    branches: [agent/codex-dev/gli-156-android-interactions]

permissions:
  contents: read
  actions: read

jobs:
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39219050148
          name: smart-tro-pilot-apk-94f1f7c0da44ce50aaa351d967f43ab600763285
          path: pilot-artifact
      - name: Verify pilot provenance
        run: |
          test "$(cat pilot-artifact/commit.txt)" = 94f1f7c0da44ce50aaa351d967f43ab600763285
          echo '31a7ece6018cc64cc62901ab67212b00ef3e42161ccf5fdc8cd5d42e67bc0fd0  pilot-artifact/smart-tro-pilot.apk' | sha256sum -c
          python3 -m unittest discover -s scripts/gli156 -p 'test_*.py' -v
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture interaction evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install pilot-artifact/smart-tro-pilot.apk
            python3 scripts/gli156/android_interactions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gli-156-interactions-${{ github.run_id }}
          path: android-interactions/
          if-no-files-found: warn
          retention-days: 14
